name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the version
    if: github.repository == 'kaanakdeniz/copilot-bar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: scripts/bump-version.sh --check "$GITHUB_REF_NAME"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build universal app
    needs: [version, ci]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # Tauri ad-hoc signs the bundle: no signing identity is configured.
      - name: Build
        run: npx tauri build --target universal-apple-darwin --bundles app
      - name: Package and check
        run: scripts/release-assets.sh package src-tauri/target/universal-apple-darwin/release/bundle "${GITHUB_REF_NAME#v}" release-assets
      - name: Build the update signature check
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example verify-update-signature
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-archive
          path: release-assets/CopilotBar.app.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-signature-check
          path: src-tauri/target/debug/examples/verify-update-signature
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign the update archive
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    # Only job with the signing key; the signer is fetched at the sha512 package-lock.json pins.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sign-update.sh
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-archive
          path: release-assets
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/sign-update.sh release-assets/CopilotBar.app.tar.gz "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-signature
          path: release-assets/CopilotBar.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify the signature and list the assets
    needs: [build, sign]
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-signature
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-signature-check
          path: ${{ runner.temp }}/check
      # Same check an install runs: a wrong key or another version fails here.
      - name: Verify the update signature
        run: |
          chmod +x "$RUNNER_TEMP/check/verify-update-signature"
          "$RUNNER_TEMP/check/verify-update-signature" release-assets/CopilotBar.app.tar.gz "${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: scripts/release-assets.sh checksums release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: verify
    runs-on: ubuntu-latest
    # The only job that can write. It runs no code from the repository or npm.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Check the assets
        working-directory: release-assets
        run: |
          sha256sum --check --strict SHA256SUMS
          listed=$( (awk '{print "./" $2}' SHA256SUMS; echo ./SHA256SUMS) | sort)
          present=$(find . -type f | sort)
          [ "$listed" = "$present" ] || { echo "unexpected assets:"; echo "$present"; exit 1; }
          test "$(wc -l < SHA256SUMS)" -eq 3
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft --verify-tag --generate-notes --title "CopilotBar ${GITHUB_REF_NAME#v}"
