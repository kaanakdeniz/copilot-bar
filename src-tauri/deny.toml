# cargo-deny configuration. CI runs `cargo deny check` against it.

[graph]
# CopilotBar ships for macOS only. Limiting the graph to these targets keeps
# Linux-only crates (glib, zbus, ...) out of the check.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
version = 2
# Fail on unmaintained crates anywhere in the graph, not just direct deps.
# Vulnerable, unmaintained and unsound crates are all errors.
unmaintained = "all"
# Each ignored advisory needs an entry like
#   { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not affect us" }
# None are ignored today.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
