[package]
name = "copilot-bar"
version = "0.0.1"
description = "Menu bar app for GitHub Copilot AI-credit and token usage"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "copilot_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
kurbo = "0.13"
jiff = "1"
# No network code.
semver = "1"
dirs = "7"
regex = "1"
once_cell = "1"
# verify-only, no I/O
minisign-verify = "0.3"
base64 = "0.23"

[dev-dependencies]
minisign = "0.10"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
